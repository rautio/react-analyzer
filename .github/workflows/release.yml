name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  # Run tests once before building
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Run tests
        run: go test -v ./...

  # Package VS Code extension
  package-extension:
    name: Package VS Code Extension
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync extension version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting extension version to $VERSION"
          cd vscode-extension
          npm version $VERSION --no-git-tag-version --allow-same-version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Compile extension
        working-directory: vscode-extension
        run: npm run compile

      - name: Package extension
        working-directory: vscode-extension
        run: |
          npm install -g @vscode/vsce
          vsce package

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: vscode-extension/*.vsix
          retention-days: 1

  # Build binaries on native platforms
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS builds (native runners)
          - os: macos-latest
            goos: darwin
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64

          # Linux builds (native runner)
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64

          # Windows build (native runner)
          - os: windows-latest
            goos: windows
            goarch: amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install ARM64 cross-compiler (Linux only)
        if: matrix.goos == 'linux' && matrix.goarch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build with GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: build --single-target --snapshot --clean
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.goos == 'linux' && matrix.goarch == 'arm64' && 'aarch64-linux-gnu-gcc' || '' }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          retention-days: 1

  # Merge artifacts and create release
  release:
    name: Release
    needs: [build, package-extension]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-downloads/
          merge-multiple: false

      - name: Create release archives
        run: |
          set -e
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#v}"

          echo "Creating release archives for version ${VERSION}"

          # Move VS Code extension to dist/
          if [ -f dist-downloads/vscode-extension/*.vsix ]; then
            echo "Including VS Code extension"
            mv dist-downloads/vscode-extension/*.vsix dist/
          fi

          # Process each platform's artifacts
          for artifact_dir in dist-downloads/dist-*; do
            if [ ! -d "$artifact_dir" ]; then
              continue
            fi

            # Extract platform info from artifact directory name
            # Format: dist-downloads/dist-{goos}-{goarch}/react-analyzer_{goos}_{goarch}_{version}/
            platform_name=$(basename "$artifact_dir" | sed 's/^dist-//')

            # Find the binary directory inside the artifact
            binary_dir=$(find "$artifact_dir" -type d -name "react-analyzer_*" | head -1)

            if [ -z "$binary_dir" ]; then
              echo "Warning: No binary directory found in $artifact_dir"
              continue
            fi

            echo "Processing $platform_name from $binary_dir"

            # Determine archive name and format
            archive_name="react-analyzer_${VERSION}_${platform_name}"

            if [[ "$platform_name" == *"windows"* ]]; then
              echo "Creating Windows zip: ${archive_name}.zip"

              # Create zip with proper structure (binary at root of archive)
              (cd "$binary_dir" && zip -r - .) > "dist/${archive_name}.zip"
            else
              echo "Creating Unix tar.gz: ${archive_name}.tar.gz"

              # Create tar.gz with proper structure (binary in react-analyzer/ subdirectory)
              tar -czf "dist/${archive_name}.tar.gz" \
                -C "$binary_dir" \
                --transform 's,^,react-analyzer/,' \
                . 2>/dev/null || tar -czf "dist/${archive_name}.tar.gz" -C "$binary_dir" .
            fi

            echo "✓ Created: $archive_name"
          done

          # Generate checksums
          cd dist
          if ls *.tar.gz *.zip 1> /dev/null 2>&1; then
            sha256sum *.tar.gz *.zip 2>/dev/null > checksums.txt || shasum -a 256 *.tar.gz *.zip > checksums.txt
            echo "✓ Generated checksums"
            echo ""
            echo "Release artifacts:"
            ls -lh *.tar.gz *.zip checksums.txt 2>/dev/null
          else
            echo "Error: No archives created"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.vsix
            dist/checksums.txt
          body: |
            ## React Analyzer ${{ github.ref_name }}

            ### CLI Installation

            **macOS/Linux (Recommended):**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/rautio/react-analyzer/main/install.sh | sh
            ```

            **Install specific version:**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/rautio/react-analyzer/main/install.sh | VERSION=${{ github.ref_name }} sh
            ```

            **Windows:**
            Download the `.zip` file below, extract it, and add `react-analyzer.exe` to your PATH.

            ### VS Code Extension Installation

            **Install from VSIX:**
            1. Download `react-analyzer-${{ github.ref_name }}.vsix` below
            2. Install via command line:
               ```bash
               code --install-extension react-analyzer-${{ github.ref_name }}.vsix
               ```

            Or via VS Code UI:
            1. Open Extensions view (Ctrl/Cmd+Shift+X)
            2. Click "..." → "Install from VSIX..."
            3. Select the downloaded `.vsix` file

            See the [extension documentation](https://github.com/rautio/react-analyzer/blob/main/vscode-extension/README.md) for features and usage.

            ---

            SHA256 checksums available in `checksums.txt`.
          draft: false
          prerelease: auto
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
